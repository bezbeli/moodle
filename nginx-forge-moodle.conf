ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_dhparam /etc/nginx/dhparams.pem;

add_header X-Frame-Options "SAMEORIGIN";
add_header X-XSS-Protection "1; mode=block";
add_header X-Content-Type-Options "nosniff";

index index.html index.htm index.php;

charset utf-8;

# Handle large file uploads for Moodle
client_max_body_size 100M;
client_body_timeout 300s;

# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/*/server/*;

# Hide all dot files but allow "Well-Known URIs" as per RFC 5785
location ~ /\.(?!well-known).* {
    return 404;
}

# Block access to internal files per Moodle security requirements
location ~ (/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|/upgrade\.txt|/UPGRADING\.md|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml) {
    deny all;
    return 404;
}

# FastCGI Configuration for PHP files with path info - Critical for Moodle 4.5+
location ~ \.php(/|$) {
    # Split the path info based on URI
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    
    # Store the original path_info - it will be wiped out by try_files
    set $path_info $fastcgi_path_info;
    
    # Look for the php file, trying a trailing slash for directories if required
    try_files $fastcgi_script_name $fastcgi_script_name/;
    
    # File was found - pass to fastcgi
    fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
    include fastcgi_params;
    
    # Re-apply the path_info after including fastcgi_params
    fastcgi_param PATH_INFO $path_info;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    
    # Increase timeouts for large Moodle operations
    fastcgi_read_timeout 300;
    fastcgi_send_timeout 300;
}

# Moodle Routing Engine - must be after PHP handler
location / {
    try_files $uri $uri/ /r.php;
}

# Static files with proper caching
location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /favicon.svg { access_log off; log_not_found off; }  
location = /robots.txt  { access_log off; log_not_found off; }

access_log off;
error_log  /var/log/nginx/*-error.log error;

error_page 404 /index.php;
